name: sync-upstream

# Mirrors pstack from the cursor/plugins monorepo into this repository.
#
# The mirror is regenerated, never hand-edited:
#   cursor/plugins/pstack  ->  vendor/pstack  (verbatim upstream)
#                          ->  skills/ + agents/ + extensions/dsh/skills.generated.json
#                              (deterministic DSH adaptation, see tools/adapt.mjs)
#
# Idempotency: a run that finds no upstream change writes nothing at all — no
# SYNC-LOG.md row and no commit. "No change" is not an event; it lives in the
# Actions run record and the job summary below, which is where a human looks for
# "did the job run, and what did it see". SYNC-LOG.md therefore only ever grows on
# a real change (an initial import, or a `Synced` row), and its dedupe is the
# backstop for a re-run of a change that was already recorded.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Content is the contract. Executable bits are not: a Windows checkout of
      # this repo has none while the runner's clone of upstream does, so git
      # would see a mode-only change on every single run.
      - name: Ignore file mode changes
        run: git config core.fileMode false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sparse clone cursor/plugins (pstack/ only)
        run: |
          set -euo pipefail
          up="$RUNNER_TEMP/cursor-plugins"
          rm -rf "$up"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/cursor/plugins "$up"
          git -C "$up" sparse-checkout set pstack
          if [ ! -d "$up/pstack" ]; then
            echo "::error::upstream structure changed: cursor/plugins/pstack/ no longer exists"
            exit 1
          fi
          if [ ! -f "$up/pstack/plugin.json" ]; then
            echo "::error::upstream structure changed: cursor/plugins/pstack/plugin.json is missing"
            exit 1
          fi
          if [ ! -d "$up/pstack/skills" ]; then
            echo "::error::upstream structure changed: cursor/plugins/pstack/skills/ is missing"
            exit 1
          fi
          echo "UPSTREAM_SHA=$(git -C "$up" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Mirror upstream into vendor/pstack
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git*' "$RUNNER_TEMP/cursor-plugins/pstack/" vendor/pstack/

      - name: Regenerate skills/, agents/ and generated fragments
        run: node tools/adapt.mjs

      - name: Guard against unadapted upstream text and upstream structural drift
        run: node tools/check-adaptation.mjs

      - name: Guard against skill-name conflicts with the host
        # No ~/.dsh on a runner, so every root is SKIPped with a printed reason.
        # The step exists for the profile case and to keep one command shape
        # shared with check.yml; it must never pass by staying silent.
        run: node tools/check-name-conflicts.mjs

      - name: Record a real upstream change in SYNC-LOG.md
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("vendor/pstack/plugin.json","utf8")).version')"
          # Anything outside SYNC-LOG.md counts as an upstream change.
          if [ -n "$(git status --porcelain -- . ':(exclude)SYNC-LOG.md')" ]; then
            result="Synced \`${UPSTREAM_SHA:0:7}\`"
          else
            result="No change"
          fi
          echo "SYNC_RESULT=$result" >> "$GITHUB_ENV"
          if [ "$result" = "No change" ]; then
            # Nothing changed upstream: do not touch the log, do not commit.
            echo "no upstream change: SYNC-LOG.md is not touched and nothing will be committed"
            exit 0
          fi
          date="$(date -u +%Y-%m-%d)"
          node -e '
            const fs = require("node:fs");
            const [date, version, result] = process.argv.slice(1);
            const row = `| ${date} | ${version} | ${result} |`;
            const path = "SYNC-LOG.md";
            const lines = fs.readFileSync(path, "utf8").split("\n");
            if (lines.includes(row)) {
              console.log(`SYNC-LOG.md already has this row: ${row}`);
              process.exit(0);
            }
            const at = lines.findIndex((line) => /^\| *-/.test(line));
            if (at < 0) throw new Error("SYNC-LOG.md has no markdown table separator row");
            lines.splice(at + 1, 0, row);
            fs.writeFileSync(path, lines.join("\n"));
            console.log(`SYNC-LOG.md appended: ${row}`);
          ' "$date" "$version" "$result"

      - name: Commit and push only when something changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::no upstream change; nothing to commit"
            exit 0
          fi
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("vendor/pstack/plugin.json","utf8")).version')"
          if [ "${SYNC_RESULT:-}" = "No change" ] || [ -z "${SYNC_RESULT:-}" ]; then
            # Unreachable by construction: a No change run writes no row, so the
            # tree cannot differ here. Say so instead of inventing a message.
            echo "::error::the tree changed but SYNC_RESULT is ${SYNC_RESULT:-unset}; refusing to guess a commit message"
            exit 1
          fi
          git commit -m "sync: pstack ${version} from ${UPSTREAM_SHA}"
          git push

      - name: Job summary
        if: always()
        run: |
          {
            echo "## pstack-dsh sync"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| upstream commit | \`${UPSTREAM_SHA:-unknown}\` |"
            echo "| result | ${SYNC_RESULT:-failed before logging} |"
            if [ "${SYNC_RESULT:-}" = "No change" ]; then
              echo "| SYNC-LOG.md | untouched (a no-change run is not an event) |"
            fi
            if [ -f extensions/dsh/skills.generated.json ]; then
              echo "| skills | $(node -p 'JSON.parse(require("node:fs").readFileSync("extensions/dsh/skills.generated.json","utf8")).skills.length') |"
            fi
            echo
            echo "SYNC-LOG.md:"
            echo '```'
            cat SYNC-LOG.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"